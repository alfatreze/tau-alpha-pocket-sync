[workspace]
members = ["crates/tps-core", "crates/tps-plugin", "crates/tps-host-test"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alfatreze/tau-pocket-sync"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
