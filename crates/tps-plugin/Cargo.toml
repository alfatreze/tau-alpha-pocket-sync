[package]
name = "tps-plugin"
description = "The Pocket Sync / pupdate plugin (wasm32-wasip1, Extism): menus and glue around tps-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tps-core = { path = "../tps-core" }

# The two host calls are the only unsafe code (the plugin ABI is extern "ExtismHost"); everything else is denied.
[lints.rust]
unsafe_code = "deny"
